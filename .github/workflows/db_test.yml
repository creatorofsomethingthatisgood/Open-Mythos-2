name: Database Connection Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-db:
    runs-on: ubuntu-latest
    
    # Example of using a service container for PostgreSQL
    # This is how you "connect database with github repo" for CI
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: mythos_test
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary
        pip install -r requirements.txt
        
    - name: Run DB Connection Test
      env:
        MYTHOS_DB_TYPE: postgres
        DB_HOST: localhost
        DB_USER: runner
        DB_PASSWORD: password
        DB_NAME: mythos_test
      run: |
        # Example test script that uses engine/database.py
        python3 -c "from engine.database import DatabaseManager; db = DatabaseManager(); db.connect(); print('Successfully connected to Postgres from GitHub Action!')"
