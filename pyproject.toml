[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mythos-sentinel"
version = "2.0.5"
description = "Mythos — local AI chat assistant and security scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mythos" }]
keywords = ["llm", "chat", "security", "sast", "cli", "local"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "llama-cpp-python>=0.2.0",
  "huggingface_hub>=0.20.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "gradio>=4.0",
  "numpy>=1.24.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
web = ["gradio>=4.0"]
rag = [
  "chromadb>=0.4.0",
  "sentence-transformers>=2.2.0",
  "PyPDF2>=3.0.0",
]
dev = ["pytest>=7.0"]
all = ["mythos-sentinel[web,rag,dev]"]

[project.scripts]
mythos = "mythos_cli.main:cli_main"

[tool.setuptools.packages.find]
include = ["mythos_cli*", "engine*", "ui*"]

[tool.setuptools.package-data]
engine = ["py.typed"]
ui = ["py.typed"]
mythos_cli = ["py.typed"]
